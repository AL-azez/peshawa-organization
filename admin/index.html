<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>لوحة تحكم المحتوى - Peshawa Organization</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="لوحة إدارة محتوى منظمة بيشوا">

    <link rel="icon" type="image/png" href="../assets/images/logo.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background-color: #f5f5f5;
        }

        #nc-root {
            width: 100%;
            height: 100%;
            min-height: 100vh;
        }

        .cms-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #6B4EE6 0%, #4A32B8 100%);
            color: #ffffff;
            text-align: center;
            padding: 2rem;
        }

        .cms-loading .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #F4C430;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .cms-loading h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .cms-loading p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .cms-loading.hidden {
            display: none;
        }
    </style>

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

    <div id="cms-loading" class="cms-loading">
        <div class="spinner"></div>
        <h1>جاري تحميل لوحة التحكم...</h1>
        <p>Loading CMS Dashboard</p>
    </div>

    <div id="nc-root"></div>

    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", function (user) {
                if (!user) {
                    window.netlifyIdentity.on("login", function () {
                        document.location.href = "/admin/";
                    });
                }
            });
        }

        window.addEventListener("load", function () {
            var loading = document.getElementById("cms-loading");
            if (loading) {
                setTimeout(function () {
                    loading.classList.add("hidden");
                }, 1500);
            }
        });

        console.log("✅ Decap CMS v3 loaded successfully");
        console.log("📍 Admin panel ready");
    </script>

</body>
</html>
