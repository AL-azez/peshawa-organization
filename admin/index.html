<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <title>لوحة تحكم المحتوى | منظمة بيشوا</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="لوحة إدارة محتوى منظمة بيشوا - واجهة آمنة وموثوقة">
    
    <!-- تحسينات الجوال والأمان -->
    <meta name="theme-color" content="#6B4EE6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://identity.netlify.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:;">

    <link rel="icon" type="image/png" href="../assets/images/logo.png">
    <link rel="apple-touch-icon" href="../assets/images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #6B4EE6;
            --primary-dark: #4A32B8;
            --accent: #F4C430;
            --bg: #f8f9fa;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            height: 100%; min-height: 100dvh; width: 100%;
            font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg); color: #1A1A2E; overflow: hidden;
        }
        #nc-root { width: 100%; min-height: 100dvh; opacity: 0; transition: opacity 0.4s ease-in-out; }
        #nc-root.loaded { opacity: 1; }
        
        .cms-loading {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #ffffff; text-align: center; padding: 2rem; z-index: 9999;
            transition: opacity 0.4s ease-in-out, visibility 0.4s;
        }
        .cms-loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        
        .cms-logo {
            width: 80px; height: 80px; background: rgba(255, 255, 255, 0.15);
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            margin-bottom: 2rem; backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .cms-logo img { width: 60px; height: 60px; object-fit: contain; border-radius: 12px; }
        
        .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin-bottom: 1.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .cms-loading h1 { font-size: clamp(1.2rem, 4vw, 1.5rem); margin-bottom: 0.5rem; font-weight: 700; }
        .cms-loading p { font-size: clamp(0.9rem, 3vw, 1rem); opacity: 0.85; font-weight: 400; }
    </style>

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js" defer></script>
</head>
<body>

    <div id="cms-loading" class="cms-loading" role="status" aria-live="polite">
        <div class="cms-logo">
            <!-- استبدل الرابط أدناه برابط شعارك الفعلي -->
            <img src="https://d.top4top.io/p_3906u7fre0.jpg" alt="شعار منظمة بيشوا">
        </div>
        <div class="spinner"></div>
        <h1>جاري تهيئة لوحة التحكم...</h1>
        <p>يرجى الانتظار، يتم تحميل الموارد الأمنية</p>
    </div>

    <div id="nc-root"></div>

    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
        // إدارة هوية Netlify (تسجيل الدخول الآمن)
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", function (user) {
                if (!user) {
                    window.netlifyIdentity.on("login", function () {
                        document.location.href = "/admin/";
                    });
                }
            });
        }

        // إدارة شاشة التحميل بسلاسة
        window.addEventListener("load", function () {
            const loadingScreen = document.getElementById("cms-loading");
            const cmsRoot = document.getElementById("nc-root");
            
            setTimeout(function () {
                if (loadingScreen) loadingScreen.classList.add("hidden");
                if (cmsRoot) cmsRoot.classList.add("loaded");
                
                setTimeout(() => {
                    if (loadingScreen) loadingScreen.remove();
                    document.body.style.overflow = 'auto';
                }, 400);
            }, 800);
        });

        console.log("%c✅ Decap CMS v3 Loaded Successfully", "color: #6B4EE6; font-weight: bold; font-size: 14px;");
    </script>
</body>
</html>
